name: Validate Admin License Key

on:
  workflow_dispatch:

jobs:
  validate-key:
    runs-on: ubuntu-latest
    steps:
      - name: Validate protected PKCS12 signing key
        shell: bash
        env:
          ADMIN_LICENSE_P12_BASE64: ${{ secrets.ADMIN_LICENSE_P12_BASE64 }}
          ADMIN_LICENSE_P12_PASSWORD: ${{ secrets.ADMIN_LICENSE_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${ADMIN_LICENSE_P12_BASE64:-}" || { echo "ADMIN_LICENSE_P12_BASE64 secret is not configured."; exit 1; }
          test -n "${ADMIN_LICENSE_P12_PASSWORD:-}" || { echo "ADMIN_LICENSE_P12_PASSWORD secret is not configured."; exit 1; }
          printf '%s' "$ADMIN_LICENSE_P12_BASE64" | base64 --decode > admin-license-private.p12
          keytool -list \
            -keystore admin-license-private.p12 \
            -storetype PKCS12 \
            -storepass "$ADMIN_LICENSE_P12_PASSWORD" \
            -alias admin-license >/dev/null
          keytool -exportcert \
            -rfc \
            -keystore admin-license-private.p12 \
            -storetype PKCS12 \
            -storepass "$ADMIN_LICENSE_P12_PASSWORD" \
            -alias admin-license \
            -file admin-license-public.pem >/dev/null
          echo "Protected admin PKCS12 key is valid."
          echo "Public certificate generated successfully."

      - name: Remove temporary key files
        if: always()
        run: rm -f admin-license-private.p12 admin-license-public.pem
