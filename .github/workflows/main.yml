name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Prepare MyAdv release keystore
        env:
          MYADV_KEYSTORE_BASE64: ${{ secrets.MYADV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$MYADV_KEYSTORE_BASE64" ]; then
            echo "MYADV_KEYSTORE_BASE64 GitHub secret is missing."
            exit 1
          fi
          printf '%s' "$MYADV_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/myadv-release.jks"
          test -s "$GITHUB_WORKSPACE/myadv-release.jks"

      - name: Build signed release APK
        env:
          MYADV_KEYSTORE_FILE: ${{ github.workspace }}/myadv-release.jks
          MYADV_STORE_PASSWORD: ${{ secrets.MYADV_STORE_PASSWORD }}
          MYADV_KEY_ALIAS: ${{ secrets.MYADV_KEY_ALIAS }}
          MYADV_KEY_PASSWORD: ${{ secrets.MYADV_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload MyAdv APK
        uses: actions/upload-artifact@v4
        with:
          name: MyAdv-release-v2.1
          path: app/build/outputs/apk/release/*.apk
