name: Build MyAdv APKs

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'MyAdv versionName (example: 2.3)'
        required: true
        default: '2.3'
        type: string
      version_code:
        description: 'Android versionCode (must increase for each release)'
        required: true
        default: '5'
        type: string
  push:
    branches:
      - main

env:
  APP_VERSION: ${{ inputs.app_version || '2.3' }}
  VERSION_CODE: ${{ inputs.version_code || '5' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Prepare release keystore
        env:
          MYADV_KEYSTORE_BASE64: ${{ secrets.MYADV_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${MYADV_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: MYADV_KEYSTORE_BASE64 GitHub secret is missing."
            exit 1
          fi
          printf '%s' "$MYADV_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/myadv-release.jks"
          test -s "$GITHUB_WORKSPACE/myadv-release.jks"

      - name: Verify release signing configuration
        env:
          MYADV_KEYSTORE_FILE: ${{ github.workspace }}/myadv-release.jks
          MYADV_STORE_PASSWORD: ${{ secrets.MYADV_STORE_PASSWORD }}
          MYADV_KEY_ALIAS: ${{ secrets.MYADV_KEY_ALIAS }}
          MYADV_KEY_PASSWORD: ${{ secrets.MYADV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MYADV_STORE_PASSWORD"
          test -n "$MYADV_KEY_ALIAS"
          test -n "$MYADV_KEY_PASSWORD"
          keytool -list -keystore "$MYADV_KEYSTORE_FILE" -storepass "$MYADV_STORE_PASSWORD" -alias "$MYADV_KEY_ALIAS" >/dev/null
          ENTRY_TYPE=$(keytool -list -v -keystore "$MYADV_KEYSTORE_FILE" -storepass "$MYADV_STORE_PASSWORD" -alias "$MYADV_KEY_ALIAS" | awk -F': ' '/Entry type:/{print $2; exit}')
          test "$ENTRY_TYPE" = "PrivateKeyEntry"
          keytool -certreq -keystore "$MYADV_KEYSTORE_FILE" -storepass "$MYADV_STORE_PASSWORD" -alias "$MYADV_KEY_ALIAS" -keypass "$MYADV_KEY_PASSWORD" -file "$RUNNER_TEMP/myadv-signing-test.csr" >/dev/null 2>&1
          rm -f "$RUNNER_TEMP/myadv-signing-test.csr"
          echo "Release signing configuration: OK"

      - name: Repair known malformed Kotlin source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/example/kbawelfaremessenger/MainActivity.kt')
          text = path.read_text(encoding='utf-8')

          # Older commits accidentally stored this SMS verification block with
          # literal backslash-n characters. Normalize it before Kotlin compile.
          pattern = re.compile(
              r'        val actualSimPhone = normalizePhone\(rawSimPhone\)\\n\\n'
              r'        // validatePhone=false explicitly permits SMS from any active SIM\.\\n'
              r'.*?'
              r'        val smsManager =',
              re.DOTALL,
          )
          replacement = '''        val actualSimPhone = normalizePhone(rawSimPhone)

        // validatePhone=false explicitly permits SMS from any active SIM.
        if (license.options.validatePhone && actualSimPhone != licensedPhone) {
            AppLogger.warning(this, "LICENSE", "Licensed phone does not match selected SMS SIM.")
            throw SmsLicenseException(
                "License/SIM mismatch.\\n\\n" +
                        "Licensed phone: $licensedPhone\\n" +
                        "Selected SMS SIM: " + actualSimPhone.ifBlank { "Unknown" } + "\\n\\n" +
                        "SMS sending is blocked."
            )
        }

        val smsManager ='''
          repaired, count = pattern.subn(replacement, text, count=1)
          if count:
              text = repaired
              print('Repaired escaped SIM verification block.')
          else:
              print('SIM verification block already normalized.')

          old_hint = 'is EditText -> view.hintTextColor = ColorStateList.valueOf(secondary)'
          new_hint = 'is EditText -> view.setHintTextColor(ColorStateList.valueOf(secondary))'
          if old_hint in text:
              text = text.replace(old_hint, new_hint)
              print('Repaired EditText hint color API usage.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Build both signed release APKs
        env:
          MYADV_KEYSTORE_FILE: ${{ github.workspace }}/myadv-release.jks
          MYADV_STORE_PASSWORD: ${{ secrets.MYADV_STORE_PASSWORD }}
          MYADV_KEY_ALIAS: ${{ secrets.MYADV_KEY_ALIAS }}
          MYADV_KEY_PASSWORD: ${{ secrets.MYADV_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :licensemanager:assembleRelease -PAPP_VERSION="$APP_VERSION" -PVERSION_CODE="$VERSION_CODE"

      - name: Locate and rename APKs for distribution
        run: |
          set -euo pipefail
          APP_APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          AM_APK=$(find licensemanager/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APP_APK"
          test -n "$AM_APK"
          cp "$APP_APK" app/build/outputs/apk/release/MyAdv.apk
          cp "$AM_APK" licensemanager/build/outputs/apk/release/MyAdv-License-Manager.apk

      - name: Verify final APK outputs
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/MyAdv.apk
          test -s licensemanager/build/outputs/apk/release/MyAdv-License-Manager.apk
          echo "Built MyAdv version: $APP_VERSION (versionCode $VERSION_CODE)"
          echo "Final distribution APKs:"
          ls -lh app/build/outputs/apk/release/MyAdv.apk licensemanager/build/outputs/apk/release/MyAdv-License-Manager.apk

      - name: Upload both APKs
        uses: actions/upload-artifact@v4
        with:
          name: MyAdv-APKs
          path: |
            app/build/outputs/apk/release/MyAdv.apk
            licensemanager/build/outputs/apk/release/MyAdv-License-Manager.apk
          if-no-files-found: error

      - name: Remove private build material
        if: always()
        run: rm -f myadv-release.jks
