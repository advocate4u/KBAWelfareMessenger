name: Create MyAdv Release Keystore

on:
  workflow_dispatch:

jobs:
  create-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Create permanent MyAdv keystore
        env:
          MYADV_STORE_PASSWORD: ${{ secrets.MYADV_STORE_PASSWORD }}
          MYADV_KEY_PASSWORD: ${{ secrets.MYADV_KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$MYADV_STORE_PASSWORD" ]; then
            echo "ERROR: MYADV_STORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$MYADV_KEY_PASSWORD" ]; then
            echo "ERROR: MYADV_KEY_PASSWORD is missing."
            exit 1
          fi

          keytool -genkeypair \
            -alias myadv \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -storetype JKS \
            -keystore "$GITHUB_WORKSPACE/myadv-release.jks" \
            -storepass "$MYADV_STORE_PASSWORD" \
            -keypass "$MYADV_KEY_PASSWORD" \
            -dname "CN=MyAdv, OU=KBAWelfareMessenger, O=Advocate4U, L=India, C=IN"

          echo "Keystore created."

          keytool -list \
            -keystore "$GITHUB_WORKSPACE/myadv-release.jks" \
            -storepass "$MYADV_STORE_PASSWORD" \
            -alias myadv >/dev/null

          echo "Keystore verification: OK"

      - name: Create Base64 file
        run: |
          set -e
          base64 -w 0 "$GITHUB_WORKSPACE/myadv-release.jks" > "$GITHUB_WORKSPACE/MYADV_KEYSTORE_BASE64.txt"
          test -s "$GITHUB_WORKSPACE/MYADV_KEYSTORE_BASE64.txt"
          sha256sum "$GITHUB_WORKSPACE/myadv-release.jks" > "$GITHUB_WORKSPACE/myadv-release.jks.sha256"
          echo "Base64 file created."

      - name: Upload new keystore package
        uses: actions/upload-artifact@v4
        with:
          name: myadv-keystore-package
          path: |
            myadv-release.jks
            MYADV_KEYSTORE_BASE64.txt
            myadv-release.jks.sha256
          retention-days: 1
