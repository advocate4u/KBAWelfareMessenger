name: Generate Initial Super Admin License

on:
  workflow_dispatch:
    inputs:
      admin_phone:
        description: 'Approved Super Admin phone number'
        required: true
        type: string
      expiry:
        description: 'Expiry date in YYYY-MM-DD'
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: License generation temporarily disabled
        run: |
          echo "Super Admin license generation is temporarily disabled while the signing-key architecture is being redesigned."
          echo "No PKCS12/P12/PFX key material is used by this workflow."
          exit 1
