name: Generate Initial Admin License

on:
  workflow_dispatch:
    inputs:
      admin_phone:
        description: 'Approved Admin phone: 9813337779 or 9104371000'
        required: true
        type: string
      expiry:
        description: 'Expiry date in YYYY-MM-DD'
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate input
        env:
          ADMIN_PHONE: ${{ inputs.admin_phone }}
          EXPIRY: ${{ inputs.expiry }}
        run: |
          set -euo pipefail
          PHONE="$(printf '%s' "$ADMIN_PHONE" | tr -cd '0-9')"
          if [ "${#PHONE}" -eq 12 ] && [[ "$PHONE" == 91* ]]; then PHONE="${PHONE:2}"; fi
          case "$PHONE" in
            9813337779|9104371000) ;;
            *) echo "Only 9813337779 or 9104371000 can receive an Admin license."; exit 1 ;;
          esac
          date -d "$EXPIRY" '+%Y-%m-%d' >/dev/null
          if [ "$(date -d "$EXPIRY" +%s)" -lt "$(date +%s)" ]; then echo "Expiry must not be in the past."; exit 1; fi

      - name: Recreate PKCS#12 private key from protected secret
        env:
          KEY_B64: ${{ secrets.ADMIN_LICENSE_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEY_B64" || { echo "ADMIN_LICENSE_PRIVATE_KEY_BASE64 secret is not configured."; exit 1; }
          printf '%s' "$KEY_B64" | base64 -d > admin-license-private.p12
          chmod 600 admin-license-private.p12

      - name: Sign Admin license
        env:
          ADMIN_PHONE: ${{ inputs.admin_phone }}
          EXPIRY: ${{ inputs.expiry }}
          P12_PASSWORD: ${{ secrets.ADMIN_LICENSE_P12_PASSWORD }}
        run: |
          set -euo pipefail
          PHONE="$(printf '%s' "$ADMIN_PHONE" | tr -cd '0-9')"
          if [ "${#PHONE}" -eq 12 ] && [[ "$PHONE" == 91* ]]; then PHONE="${PHONE:2}"; fi
          PHONE="91$PHONE"
          PAYLOAD="phone=$PHONE\nexpiry=$EXPIRY\nrole=ADMIN"
          printf '%b' "$PAYLOAD" > payload.txt

          test -n "$P12_PASSWORD" || { echo "ADMIN_LICENSE_P12_PASSWORD secret is not configured."; exit 1; }
          openssl pkcs12 -in admin-license-private.p12 -nocerts -nodes -passin pass:"$P12_PASSWORD" -out private-key.pem
          chmod 600 private-key.pem
          SIGNATURE_B64="$(openssl dgst -sha256 -sign private-key.pem payload.txt | base64 -w 0)"
          PAYLOAD_B64="$(base64 -w 0 payload.txt)"
          A="$(tr -dc 'A-Z0-9' </dev/urandom | head -c 1 || true)"
          B="$(tr -dc 'A-Z0-9' </dev/urandom | head -c 4 || true)"
          C="$(tr -dc 'A-Z0-9' </dev/urandom | head -c 4 || true)"
          D="$(tr -dc 'A-Z0-9' </dev/urandom | head -c 4 || true)"
          RANDOM_ID="ANI${A}-${B}-${C}-${D}"
          {
            echo "MyAdv INITIAL ADMIN LICENSE"
            echo "License ID: $RANDOM_ID"
            echo "Phone: +91 ${PHONE:2}"
            echo "Expiry: $EXPIRY"
            echo
            echo "Signed Token:"
            echo "$PAYLOAD_B64.$SIGNATURE_B64"
          } > MYADV_ADMIN_LICENSE.txt
          rm -f admin-license-private.p12 private-key.pem payload.txt

      - name: Upload Admin license artifact
        uses: actions/upload-artifact@v4
        with:
          name: myadv-admin-license-${{ inputs.admin_phone }}
          path: MYADV_ADMIN_LICENSE.txt
          retention-days: 7
