name: Build MyAdv APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Prepare release keystore
        env:
          KEYSTORE_B64: ${{ secrets.MYADV_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: MYADV_KEYSTORE_BASE64 GitHub secret is missing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/release-keystore.jks"
          test -s "$GITHUB_WORKSPACE/release-keystore.jks"

      - name: Build both APKs
        env:
          MYADV_KEYSTORE_FILE: ${{ github.workspace }}/release-keystore.jks
          MYADV_STORE_PASSWORD: ${{ secrets.MYADV_STORE_PASSWORD }}
          MYADV_KEY_ALIAS: ${{ secrets.MYADV_KEY_ALIAS }}
          MYADV_KEY_PASSWORD: ${{ secrets.MYADV_KEY_PASSWORD }}
          ADMIN_LICENSE_P12_BASE64: ${{ secrets.ADMIN_LICENSE_P12_BASE64 }}
          ADMIN_LICENSE_P12_PASSWORD: ${{ secrets.ADMIN_LICENSE_P12_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${ADMIN_LICENSE_P12_BASE64:-}" || { echo "ERROR: ADMIN_LICENSE_P12_BASE64 secret is missing."; exit 1; }
          test -n "${ADMIN_LICENSE_P12_PASSWORD:-}" || { echo "ERROR: ADMIN_LICENSE_P12_PASSWORD secret is missing."; exit 1; }
          umask 077
          printf '%s' "$ADMIN_LICENSE_P12_BASE64" | base64 --decode > admin-license-private.p12
          test -s admin-license-private.p12
          MYADV_LICENSE_PRIVATE_KEY_B64="$(openssl pkcs12 -in admin-license-private.p12 -nocerts -nodes -passin pass:"$ADMIN_LICENSE_P12_PASSWORD" | openssl pkcs8 -topk8 -nocrypt -outform DER | base64 -w 0)
          test -n "$MYADV_LICENSE_PRIVATE_KEY_B64"
          export MYADV_LICENSE_PRIVATE_KEY_B64
          ./gradlew :app:assembleRelease :licensemanager:assembleRelease
          rm -f admin-license-private.p12
      - name: Verify APK outputs
        run: |
          set -e
          test -n "$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$(find licensemanager/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          echo "Generated APKs:"
          find app/build/outputs/apk/release licensemanager/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MyAdv-APKs
          path: |
            app/build/outputs/apk/release/*.apk
            licensemanager/build/outputs/apk/release/*.apk
          if-no-files-found: error
