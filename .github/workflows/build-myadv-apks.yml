name: Build MyAdv APKs (manual)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/build-escaped-kotlin

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Repair escaped Kotlin source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/kbawelfaremessenger/MainActivity.kt')
          s = p.read_text()
          old = '''        val actualSimPhone = normalizePhone(rawSimPhone)\\n\\n        // validatePhone=false explicitly permits SMS from any active SIM.\\n        if (license.options.validatePhone && actualSimPhone != licensedPhone) {\\n            AppLogger.warning(this, "LICENSE", "Licensed phone does not match selected SMS SIM.")\\n            throw SmsLicenseException(\\n                "License/SIM mismatch.\\\\n\\\\n" +\\n                        "Licensed phone: $licensedPhone\\\\n" +\\n                        "Selected SMS SIM: " + actualSimPhone.ifBlank { "Unknown" } + "\\\\n\\\\n" +\\n                        "SMS sending is blocked."\\n            )\\n        }\\n\\n'''
          new = '''        val actualSimPhone = normalizePhone(rawSimPhone)

        // validatePhone=false explicitly permits SMS from any active SIM.
        if (license.options.validatePhone) {
            val licensedPhones = license.let {
                listOfNotNull(it.phone, it.secondaryPhone)
                    .map(::normalizePhone)
                    .filter { phone -> phone.isNotBlank() }
            }
            if (actualSimPhone.isBlank() || !licensedPhones.contains(actualSimPhone)) {
                AppLogger.warning(this, "LICENSE", "Licensed phone does not match selected SMS SIM.")
                throw SmsLicenseException(
                    "License/SIM mismatch.\\n\\n" +
                            "Licensed phone: ${licensedPhones.joinToString(", ")}\\n" +
                            "Selected SMS SIM: " + actualSimPhone.ifBlank { "Unknown" } + "\\n\\n" +
                            "SMS sending is blocked."
                )
            }
        }

'''
          if old not in s:
              raise SystemExit('Expected escaped SMS verification block was not found')
          s = s.replace(old, new, 1)
          s = s.replace('view.hintTextColor = ColorStateList.valueOf(secondary)', 'view.setHintTextColor(secondary)', 1)
          p.write_text(s)
          PY

      - name: Commit source repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No source repair needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/kbawelfaremessenger/MainActivity.kt
          git commit -m "Fix MainActivity Kotlin compile errors [skip ci]"
          git push

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Prepare release keystore
        env:
          KEYSTORE_B64: ${{ secrets.MYADV_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "ERROR: MYADV_KEYSTORE_BASE64 GitHub secret is missing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/release-keystore.jks"
          test -s "$GITHUB_WORKSPACE/release-keystore.jks"

      - name: Build both APKs
        env:
          MYADV_KEYSTORE_FILE: ${{ github.workspace }}/release-keystore.jks
          MYADV_STORE_PASSWORD: ${{ secrets.MYADV_STORE_PASSWORD }}
          MYADV_KEY_ALIAS: ${{ secrets.MYADV_KEY_ALIAS }}
          MYADV_KEY_PASSWORD: ${{ secrets.MYADV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease :licensemanager:assembleRelease

      - name: Locate and rename release APKs
        run: |
          set -euo pipefail
          APP_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          LICENSE_APK="$(find licensemanager/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APP_APK"
          test -n "$LICENSE_APK"
          mv "$APP_APK" app/build/outputs/apk/release/MyAdv.apk
          mv "$LICENSE_APK" licensemanager/build/outputs/apk/release/MyAdv-License-Manager.apk

      - name: Remove private build material
        if: always()
        shell: bash
        run: rm -f release-keystore.jks

      - name: Verify APK outputs
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/MyAdv.apk
          test -s licensemanager/build/outputs/apk/release/MyAdv-License-Manager.apk
          echo "Generated APKs:"
          ls -lh app/build/outputs/apk/release/MyAdv.apk licensemanager/build/outputs/apk/release/MyAdv-License-Manager.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MyAdv-APKs
          path: |
            app/build/outputs/apk/release/MyAdv.apk
            licensemanager/build/outputs/apk/release/MyAdv-License-Manager.apk
          if-no-files-found: error
