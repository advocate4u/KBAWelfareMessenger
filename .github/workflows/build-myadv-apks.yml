name: Build MyAdv APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Prepare release keystore
        env:
          KEYSTORE_B64: ${{ secrets.MYADV_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "ERROR: MYADV_KEYSTORE_BASE64 GitHub secret is missing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/release-keystore.jks"
          test -s "$GITHUB_WORKSPACE/release-keystore.jks"

      - name: Validate admin license P12
        env:
          ADMIN_LICENSE_P12_BASE64: ${{ secrets.ADMIN_LICENSE_P12_BASE64 }}
          ADMIN_LICENSE_P12_PASSWORD: ${{ secrets.ADMIN_LICENSE_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          test -n "${ADMIN_LICENSE_P12_BASE64:-}" || {
            echo "ERROR: ADMIN_LICENSE_P12_BASE64 GitHub secret is missing."
            exit 1
          }
          test -n "${ADMIN_LICENSE_P12_PASSWORD:-}" || {
            echo "ERROR: ADMIN_LICENSE_P12_PASSWORD GitHub secret is missing."
            exit 1
          }

          if ! printf '%s' "$ADMIN_LICENSE_P12_BASE64" | base64 --decode > admin-license-private.p12 2>base64-error.txt; then
            echo "ERROR: ADMIN_LICENSE_P12_BASE64 is not valid Base64."
            cat base64-error.txt
            exit 1
          fi
          chmod 600 admin-license-private.p12
          test -s admin-license-private.p12 || {
            echo "ERROR: Decoded ADMIN_LICENSE_P12_BASE64 produced an empty P12 file."
            exit 1
          }

          if ! keytool -list \
            -keystore admin-license-private.p12 \
            -storetype PKCS12 \
            -storepass "$ADMIN_LICENSE_P12_PASSWORD" \
            > keytool-list.txt 2>&1; then
            echo "ERROR: Admin license P12 validation failed."
            echo "The P12 password does not match, or the P12 secret is corrupt/not a valid PKCS12 keystore."
            echo "Keytool diagnostic:"
            cat keytool-list.txt
            exit 1
          fi

          ALIAS=$(awk -F': ' '/^Alias name: / {print $2; exit}' keytool-list.txt)
          test -n "$ALIAS" || {
            echo "ERROR: No alias was found in the admin license P12."
            cat keytool-list.txt
            exit 1
          }

          if ! keytool -exportcert \
            -rfc \
            -keystore admin-license-private.p12 \
            -storetype PKCS12 \
            -storepass "$ADMIN_LICENSE_P12_PASSWORD" \
            -alias "$ALIAS" \
            -file admin-license-public.pem >/dev/null 2>export-error.txt; then
            echo "ERROR: Admin license P12 opened but its certificate could not be exported."
            cat export-error.txt
            exit 1
          fi

          test -s admin-license-public.pem || {
            echo "ERROR: Admin license P12 validation produced no public certificate."
            exit 1
          }

          echo "Admin license P12 validated successfully. Alias: $ALIAS"

      - name: Build both APKs
        env:
          MYADV_KEYSTORE_FILE: ${{ github.workspace }}/release-keystore.jks
          MYADV_STORE_PASSWORD: ${{ secrets.MYADV_STORE_PASSWORD }}
          MYADV_KEY_ALIAS: ${{ secrets.MYADV_KEY_ALIAS }}
          MYADV_KEY_PASSWORD: ${{ secrets.MYADV_KEY_PASSWORD }}
          ADMIN_LICENSE_P12_BASE64: ${{ secrets.ADMIN_LICENSE_P12_BASE64 }}
          ADMIN_LICENSE_P12_PASSWORD: ${{ secrets.ADMIN_LICENSE_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          rm -f admin-license-private.p12 admin-license-private.pem
          printf '%s' "$ADMIN_LICENSE_P12_BASE64" | base64 --decode > admin-license-private.p12
          test -s admin-license-private.p12

          openssl pkcs12 -in admin-license-private.p12 -nocerts -nodes \
            -passin env:ADMIN_LICENSE_P12_PASSWORD \
            -out admin-license-private.pem
          chmod 600 admin-license-private.pem

          MYADV_LICENSE_PRIVATE_KEY_B64="$(openssl pkcs8 -topk8 -nocrypt -in admin-license-private.pem -outform DER | base64 -w 0)"
          test -n "$MYADV_LICENSE_PRIVATE_KEY_B64"
          export MYADV_LICENSE_PRIVATE_KEY_B64

          ./gradlew :app:assembleRelease :licensemanager:assembleRelease

      - name: Remove private license key material
        if: always()
        shell: bash
        run: rm -f admin-license-private.p12 admin-license-private.pem admin-license-public.pem keytool-list.txt base64-error.txt export-error.txt

      - name: Verify APK outputs
        run: |
          set -euo pipefail
          test -n "$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$(find licensemanager/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          echo "Generated APKs:"
          find app/build/outputs/apk/release licensemanager/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MyAdv-APKs
          path: |
            app/build/outputs/apk/release/*.apk
            licensemanager/build/outputs/apk/release/*.apk
          if-no-files-found: error
