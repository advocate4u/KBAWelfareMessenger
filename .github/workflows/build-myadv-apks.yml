name: Build MyAdv APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare release keystore
        env:
          KEYSTORE_B64: ${{ secrets.MYADV_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > release-keystore.jks
      - name: Build both APKs
        env:
          MYADV_KEYSTORE_FILE: ${{ github.workspace }}/release-keystore.jks
          MYADV_STORE_PASSWORD: ${{ secrets.MYADV_STORE_PASSWORD }}
          MYADV_KEY_ALIAS: ${{ secrets.MYADV_KEY_ALIAS }}
          MYADV_KEY_PASSWORD: ${{ secrets.MYADV_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :licensemanager:assembleRelease
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MyAdv-APKs
          path: |
            app/build/outputs/apk/release/*.apk
            licensemanager/build/outputs/apk/release/*.apk
