name: Sync Admin Public Key

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-public-key:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenSSL
        shell: bash
        env:
          ADMIN_LICENSE_PRIVATE_KEY: ${{ secrets.ADMIN_LICENSE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$ADMIN_LICENSE_PRIVATE_KEY" > admin-license-private.pem
          openssl pkey -in admin-license-private.pem -pubout -out admin-license-public.pem
          openssl pkey -in admin-license-private.pem -pubout -outform DER | sha256sum > public-key.sha256
          rm -f admin-license-private.pem

      - name: Replace embedded public key
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("app/src/main/java/com/example/kbawelfaremessenger/LicenseManager.kt")
          text = path.read_text(encoding="utf-8")
          public_key = Path("admin-license-public.pem").read_text(encoding="utf-8").strip()

          pattern = r'private const val PUBLIC_KEY_PEM = """.*?"""\.trimIndent\(\)'
          replacement = 'private const val PUBLIC_KEY_PEM = """\n' + public_key + '\n""".trimIndent()'
          updated, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit("PUBLIC_KEY_PEM block was not found exactly once")
          path.write_text(updated, encoding="utf-8")

      - name: Remove temporary public key files
        shell: bash
        run: rm -f admin-license-public.pem public-key.sha256

      - name: Commit updated public key
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/src/main/java/com/example/kbawelfaremessenger/LicenseManager.kt; then
            echo "Embedded public key is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/kbawelfaremessenger/LicenseManager.kt
          git commit -m "Sync admin license public key"
          git push
