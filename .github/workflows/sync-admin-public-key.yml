name: Sync Admin Public Key

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-public-key:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive public key from protected PKCS12 key
        shell: bash
        env:
          ADMIN_LICENSE_P12_BASE64: ${{ secrets.ADMIN_LICENSE_P12_BASE64 }}
          ADMIN_LICENSE_P12_PASSWORD: ${{ secrets.ADMIN_LICENSE_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          test -n "${ADMIN_LICENSE_P12_BASE64:-}" || { echo "ADMIN_LICENSE_P12_BASE64 secret is empty or unavailable."; exit 1; }
          test -n "${ADMIN_LICENSE_P12_PASSWORD:-}" || { echo "ADMIN_LICENSE_P12_PASSWORD secret is empty or unavailable."; exit 1; }

          printf '%s' "$ADMIN_LICENSE_P12_BASE64" | base64 --decode > admin-license-private.p12

          keytool -list \
            -keystore admin-license-private.p12 \
            -storetype PKCS12 \
            -storepass "$ADMIN_LICENSE_P12_PASSWORD" \
            -alias admin-license >/dev/null

          keytool -exportcert \
            -rfc \
            -keystore admin-license-private.p12 \
            -storetype PKCS12 \
            -storepass "$ADMIN_LICENSE_P12_PASSWORD" \
            -alias admin-license \
            -file admin-license-public.pem

      - name: Replace embedded public key
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("app/src/main/java/com/example/kbawelfaremessenger/LicenseManager.kt")
          text = path.read_text(encoding="utf-8")
          public_key = Path("admin-license-public.pem").read_text(encoding="utf-8").strip()

          pattern = r'private const val PUBLIC_KEY_PEM = """.*?"""(?:\.trimIndent\(\))?'
          replacement = 'private const val PUBLIC_KEY_PEM = """\n' + public_key + '\n""".trimIndent()'
          updated, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit("PUBLIC_KEY_PEM block was not found exactly once")
          path.write_text(updated, encoding="utf-8")

      - name: Remove temporary key files
        if: always()
        shell: bash
        run: rm -f admin-license-private.p12 admin-license-public.pem

      - name: Commit updated public key
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/src/main/java/com/example/kbawelfaremessenger/LicenseManager.kt; then
            echo "Embedded public key is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/kbawelfaremessenger/LicenseManager.kt
          git commit -m "Sync admin license public key"
          git push
