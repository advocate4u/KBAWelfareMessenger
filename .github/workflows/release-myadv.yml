name: Build MyAdv Release (Custom Version)

"on":
  workflow_dispatch:
    inputs:
      app_version:
        description: MyAdv versionName, for example 2.4
        required: true
        default: '2.4'
        type: string
      version_code:
        description: Android versionCode, use a higher number than the previous release
        required: true
        default: '6'
        type: string

jobs:
  build:
    name: Build signed MyAdv APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle wrapper
        run: gradle wrapper

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Prepare release keystore
        env:
          MYADV_KEYSTORE_BASE64: ${{ secrets.MYADV_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$MYADV_KEYSTORE_BASE64"
          printf '%s' "$MYADV_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/myadv-release.jks"
          test -s "$GITHUB_WORKSPACE/myadv-release.jks"

      - name: Verify signing configuration
        env:
          KEYSTORE: ${{ github.workspace }}/myadv-release.jks
          STORE_PASSWORD: ${{ secrets.MYADV_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MYADV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MYADV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build both release APKs
        env:
          APP_VERSION: ${{ inputs.app_version }}
          VERSION_CODE: ${{ inputs.version_code }}
          MYADV_KEYSTORE_FILE: ${{ github.workspace }}/myadv-release.jks
          MYADV_STORE_PASSWORD: ${{ secrets.MYADV_STORE_PASSWORD }}
          MYADV_KEY_ALIAS: ${{ secrets.MYADV_KEY_ALIAS }}
          MYADV_KEY_PASSWORD: ${{ secrets.MYADV_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :licensemanager:assembleRelease -PAPP_VERSION="$APP_VERSION" -PVERSION_CODE="$VERSION_CODE"

      - name: Rename final APKs
        run: |
          set -euo pipefail
          APP_APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          LICENSE_APK=$(find licensemanager/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APP_APK"
          test -n "$LICENSE_APK"
          cp "$APP_APK" app/build/outputs/apk/release/MyAdv.apk
          cp "$LICENSE_APK" licensemanager/build/outputs/apk/release/MyAdv-License-Manager.apk

      - name: Verify APKs
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/MyAdv.apk
          test -s licensemanager/build/outputs/apk/release/MyAdv-License-Manager.apk
          echo "MyAdv version: ${{ inputs.app_version }} (versionCode ${{ inputs.version_code }})"
          ls -lh app/build/outputs/apk/release/MyAdv.apk licensemanager/build/outputs/apk/release/MyAdv-License-Manager.apk

      - name: Upload MyAdv-APKs
        uses: actions/upload-artifact@v4
        with:
          name: MyAdv-APKs
          path: |
            app/build/outputs/apk/release/MyAdv.apk
            licensemanager/build/outputs/apk/release/MyAdv-License-Manager.apk
          if-no-files-found: error

      - name: Cleanup signing material
        if: always()
        run: rm -f myadv-release.jks
