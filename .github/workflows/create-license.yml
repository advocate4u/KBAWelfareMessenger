name: Create Advocate License

on:
  workflow_dispatch:
    inputs:
      phone:
        description: 'Licensed Indian mobile number (10 digits or +91XXXXXXXXXX)'
        required: true
        type: string
      expiry:
        description: 'License expiry date (YYYY-MM-DD)'
        required: true
        type: string

jobs:
  create-license:
    runs-on: ubuntu-latest

    steps:
      - name: Validate inputs
        env:
          PHONE_INPUT: ${{ inputs.phone }}
          EXPIRY_INPUT: ${{ inputs.expiry }}
        run: |
          set -euo pipefail
          PHONE=$(printf '%s' "$PHONE_INPUT" | tr -cd '0-9')
          if [ "${#PHONE}" -eq 10 ]; then
            PHONE="91$PHONE"
          fi
          if ! printf '%s' "$PHONE" | grep -Eq '^91[0-9]{10}$'; then
            echo "ERROR: Enter a valid Indian mobile number."
            exit 1
          fi
          if ! date -u -d "$EXPIRY_INPUT" '+%Y-%m-%d' >/dev/null 2>&1; then
            echo "ERROR: Expiry must be YYYY-MM-DD."
            exit 1
          fi
          if [ "$(date -u -d "$EXPIRY_INPUT" '+%Y-%m-%d')" != "$EXPIRY_INPUT" ]; then
            echo "ERROR: Expiry must be a real date in YYYY-MM-DD format."
            exit 1
          fi
          echo "PHONE=$PHONE" >> "$GITHUB_ENV"
          echo "EXPIRY=$EXPIRY_INPUT" >> "$GITHUB_ENV"

      - name: Load protected PKCS12 signing key
        env:
          ADMIN_LICENSE_P12_BASE64: ${{ secrets.ADMIN_LICENSE_P12_BASE64 }}
          ADMIN_LICENSE_P12_PASSWORD: ${{ secrets.ADMIN_LICENSE_P12_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_LICENSE_P12_BASE64" || { echo "ERROR: ADMIN_LICENSE_P12_BASE64 secret is not configured."; exit 1; }
          test -n "$ADMIN_LICENSE_P12_PASSWORD" || { echo "ERROR: ADMIN_LICENSE_P12_PASSWORD secret is not configured."; exit 1; }
          printf '%s' "$ADMIN_LICENSE_P12_BASE64" | base64 --decode > admin-license-private.p12
          chmod 600 admin-license-private.p12
          keytool -list -keystore admin-license-private.p12 -storetype PKCS12 -storepass "$ADMIN_LICENSE_P12_PASSWORD" -alias admin-license >/dev/null
          echo "PKCS12 signing key loaded and validated."

      - name: Create signed license
        run: |
          set -euo pipefail

          LICENSE_ID=$(printf 'ANI%s-%s-%s-%s' \
            "$(tr -dc 'A-Z0-9' </dev/urandom | head -c1)" \
            "$(tr -dc 'A-Z0-9' </dev/urandom | head -c4)" \
            "$(tr -dc 'A-Z0-9' </dev/urandom | head -c4)" \
            "$(tr -dc 'A-Z0-9' </dev/urandom | head -c4)")

          printf 'phone=%s\nexpiry=%s\n' "$PHONE" "$EXPIRY" > license-payload.txt

          keytool -importkeystore \
            -srckeystore admin-license-private.p12 \
            -srcstoretype PKCS12 \
            -srcstorepass "$ADMIN_LICENSE_P12_PASSWORD" \
            -srcalias admin-license \
            -destkeystore admin-license-signing.p12 \
            -deststoretype PKCS12 \
            -deststorepass "$ADMIN_LICENSE_P12_PASSWORD" \
            -destkeypass "$ADMIN_LICENSE_P12_PASSWORD" \
            -noprompt >/dev/null

          keytool -exportcert \
            -keystore admin-license-signing.p12 \
            -storetype PKCS12 \
            -storepass "$ADMIN_LICENSE_P12_PASSWORD" \
            -alias admin-license \
            -rfc \
            -file admin-license-public.pem >/dev/null

          openssl x509 -pubkey -noout -in admin-license-public.pem > admin-license-public-key.pem

          openssl pkcs12 \
            -in admin-license-signing.p12 \
            -nocerts \
            -nodes \
            -passin pass:"$ADMIN_LICENSE_P12_PASSWORD" \
            -out private-key.pem
          chmod 600 private-key.pem

          openssl dgst -sha256 \
            -sign private-key.pem \
            -out license-signature.bin \
            license-payload.txt

          PAYLOAD_B64=$(base64 -w 0 license-payload.txt)
          SIGNATURE_B64=$(base64 -w 0 license-signature.bin)
          TOKEN="$PAYLOAD_B64.$SIGNATURE_B64"

          printf '%s\n' "$LICENSE_ID" > LICENSE_ID.txt
          printf '%s\n' "$TOKEN" > SIGNED_LICENSE_TOKEN.txt
          {
            echo "KBAWelfareMessenger License"
            echo "License ID: $LICENSE_ID"
            echo "Phone: $PHONE"
            echo "Expiry: $EXPIRY"
            echo ""
            echo "Signed license token:"
            echo "$TOKEN"
          } > LICENSE.txt

          echo "License created successfully."
          echo "License ID: $LICENSE_ID"
          echo "Expiry: $EXPIRY"

      - name: Remove private key material
        if: always()
        run: |
          rm -f admin-license-private.p12 admin-license-signing.p12 private-key.pem license-signature.bin license-payload.txt admin-license-public.pem admin-license-public-key.pem

      - name: Upload license package
        uses: actions/upload-artifact@v4
        with:
          name: advocate-license
          path: |
            LICENSE.txt
            LICENSE_ID.txt
            SIGNED_LICENSE_TOKEN.txt
          retention-days: 1
