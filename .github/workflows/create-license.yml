name: Create Advocate License

on:
  workflow_dispatch:
    inputs:
      phone:
        description: 'Licensed Indian mobile number (10 digits or +91XXXXXXXXXX)'
        required: true
        type: string
      expiry:
        description: 'License expiry date (YYYY-MM-DD)'
        required: true
        type: string

jobs:
  create-license:
    runs-on: ubuntu-latest

    steps:
      - name: Validate inputs
        env:
          PHONE_INPUT: ${{ inputs.phone }}
          EXPIRY_INPUT: ${{ inputs.expiry }}
        run: |
          set -e
          PHONE=$(printf '%s' "$PHONE_INPUT" | tr -cd '0-9')
          if [ "${#PHONE}" -eq 10 ]; then
            PHONE="91$PHONE"
          fi
          if ! printf '%s' "$PHONE" | grep -Eq '^91[0-9]{10}$'; then
            echo "ERROR: Enter a valid Indian mobile number."
            exit 1
          fi
          if ! date -u -d "$EXPIRY_INPUT" '+%Y-%m-%d' >/dev/null 2>&1; then
            echo "ERROR: Expiry must be YYYY-MM-DD."
            exit 1
          fi
          if [ "$(date -u -d "$EXPIRY_INPUT" '+%Y-%m-%d')" != "$EXPIRY_INPUT" ]; then
            echo "ERROR: Expiry must be a real date in YYYY-MM-DD format."
            exit 1
          fi
          echo "PHONE=$PHONE" >> "$GITHUB_ENV"
          echo "EXPIRY=$EXPIRY_INPUT" >> "$GITHUB_ENV"

      - name: Check admin private key secret
        env:
          ADMIN_LICENSE_PRIVATE_KEY_BASE64: ${{ secrets.ADMIN_LICENSE_PRIVATE_KEY_BASE64 }}
        run: |
          set -e
          if [ -z "$ADMIN_LICENSE_PRIVATE_KEY_BASE64" ]; then
            echo "ERROR: ADMIN_LICENSE_PRIVATE_KEY_BASE64 is not configured."
            exit 1
          fi

      - name: Recreate admin private key
        env:
          ADMIN_LICENSE_PRIVATE_KEY_BASE64: ${{ secrets.ADMIN_LICENSE_PRIVATE_KEY_BASE64 }}
        run: |
          set -e
          printf '%s' "$ADMIN_LICENSE_PRIVATE_KEY_BASE64" | base64 -d > admin-license-private.p12
          keytool -list \
            -keystore admin-license-private.p12 \
            -storepass temp-password \
            -alias admin-license >/dev/null
          keytool -importkeystore \
            -srckeystore admin-license-private.p12 \
            -srcstoretype PKCS12 \
            -srcstorepass temp-password \
            -srcalias admin-license \
            -destkeystore admin-license-private.p12.tmp \
            -deststoretype PKCS12 \
            -deststorepass temp-password \
            -destalias admin-license \
            -noprompt >/dev/null 2>&1 || true
          keytool -importkeystore \
            -srckeystore admin-license-private.p12 \
            -srcstoretype PKCS12 \
            -srcstorepass temp-password \
            -srcalias admin-license \
            -destkeystore admin-license-private.p12 \
            -deststoretype PKCS12 \
            -deststorepass temp-password \
            -destalias admin-license \
            -noprompt >/dev/null 2>&1 || true
          keytool -importkeystore \
            -srckeystore admin-license-private.p12 \
            -srcstoretype PKCS12 \
            -srcstorepass temp-password \
            -srcalias admin-license \
            -destkeystore admin-license-signing.p12 \
            -deststoretype PKCS12 \
            -deststorepass temp-password \
            -destkeypass temp-password \
            -destalias admin-license \
            -noprompt >/dev/null 2>&1
          keytool -importkeystore \
            -srckeystore admin-license-signing.p12 \
            -srcstoretype PKCS12 \
            -srcstorepass temp-password \
            -srcalias admin-license \
            -destkeystore admin-license-signing.p12.tmp \
            -deststoretype PKCS12 \
            -deststorepass temp-password \
            -destkeypass temp-password \
            -destalias admin-license \
            -noprompt >/dev/null 2>&1 || true

          keytool -importkeystore \
            -srckeystore admin-license-private.p12 \
            -srcstoretype PKCS12 \
            -srcstorepass temp-password \
            -srcalias admin-license \
            -destkeystore admin-license-signing.p12 \
            -deststoretype PKCS12 \
            -deststorepass temp-password \
            -destkeypass temp-password \
            -destalias admin-license \
            -noprompt >/dev/null 2>&1

          keytool -exportcert \
            -rfc \
            -keystore admin-license-signing.p12 \
            -storepass temp-password \
            -alias admin-license \
            -file admin-license-public.pem

      - name: Create signed license
        run: |
          set -e

          LICENSE_ID=$(printf 'ANI%s-%s-%s-%s' \
            "$(tr -dc 'A-Z0-9' </dev/urandom | head -c1)" \
            "$(tr -dc 'A-Z0-9' </dev/urandom | head -c4)" \
            "$(tr -dc 'A-Z0-9' </dev/urandom | head -c4)" \
            "$(tr -dc 'A-Z0-9' </dev/urandom | head -c4)")

          PAYLOAD="phone=$PHONE\nexpiry=$EXPIRY"
          printf '%b' "$PAYLOAD" > license-payload.txt

          keytool -importkeystore \
            -srckeystore admin-license-signing.p12 \
            -srcstoretype PKCS12 \
            -srcstorepass temp-password \
            -srcalias admin-license \
            -destkeystore signing.jks \
            -deststoretype JKS \
            -deststorepass temp-password \
            -destkeypass temp-password \
            -destalias admin-license \
            -noprompt >/dev/null 2>&1

          keytool -certreq \
            -keystore signing.jks \
            -storepass temp-password \
            -keypass temp-password \
            -alias admin-license \
            -file /tmp/license.csr >/dev/null 2>&1

          # Use OpenSSL to sign the exact two-line payload with the RSA private key.
          openssl pkcs12 -in admin-license-signing.p12 \
            -passin pass:temp-password \
            -nocerts -nodes -out admin-license-private.pem >/dev/null 2>&1

          openssl dgst -sha256 \
            -sign admin-license-private.pem \
            -out license-signature.bin \
            license-payload.txt

          PAYLOAD_B64=$(base64 -w 0 license-payload.txt)
          SIGNATURE_B64=$(base64 -w 0 license-signature.bin)
          TOKEN="$PAYLOAD_B64.$SIGNATURE_B64"

          printf '%s\n' "$LICENSE_ID" > LICENSE_ID.txt
          printf '%s\n' "$TOKEN" > SIGNED_LICENSE_TOKEN.txt
          {
            echo "KBAWelfareMessenger License"
            echo "License ID: $LICENSE_ID"
            echo "Phone: $PHONE"
            echo "Expiry: $EXPIRY"
            echo ""
            echo "Signed license token:"
            echo "$TOKEN"
          } > LICENSE.txt

          echo "License created successfully."
          echo "License ID: $LICENSE_ID"
          echo "Expiry: $EXPIRY"

      - name: Upload license package
        uses: actions/upload-artifact@v4
        with:
          name: advocate-license
          path: |
            LICENSE.txt
            LICENSE_ID.txt
            SIGNED_LICENSE_TOKEN.txt
          retention-days: 1
