name: Create Advocate License

on:
  workflow_dispatch:
    inputs:
      phone:
        description: 'Licensed Indian mobile number (10 digits or +91XXXXXXXXXX)'
        required: true
        type: string
      expiry:
        description: 'License expiry date (YYYY-MM-DD)'
        required: true
        type: string

jobs:
  create-license:
    runs-on: ubuntu-latest
    steps:
      - name: License signing temporarily disabled
        run: |
          echo "License generation is temporarily disabled while the signing-key architecture is being redesigned."
          echo "No PKCS12/P12/PFX key material is used by this workflow."
          exit 1
